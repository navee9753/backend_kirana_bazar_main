<section class="page-shell">
  <header class="page-head">
    <div>
      <p class="eyebrow">Billing</p>
      <h2>Point of sale</h2>
    </div>
    <button type="button" class="action-button">+ New bill</button>
  </header>

  <div class="billing-grid">
    <section class="panel catalog-panel">
      <div class="panel-head">
        <h3>Quick items</h3>
      </div>

      <div class="catalog-list">
        <button type="button" class="catalog-item" *ngFor="let item of catalog">
          <div>
            <strong>{{ item.name }}</strong>
            <small>{{ item.qty }} left</small>
          </div>
          <span>₹{{ item.price }}</span>
        </button>
      </div>
    </section>

    <aside class="panel cart-panel">
      <div class="panel-head">
        <h3>Cart</h3>
      </div>

      <div class="cart-list">
        <div class="cart-item" *ngFor="let item of cart">
          <div>
            <strong>{{ item.name }}</strong>
            <small>{{ item.qty }} x ₹{{ item.price }}</small>
          </div>
          <span>₹{{ item.qty * item.price }}</span>
        </div>
      </div>

      <div class="totals">
        <div class="line">
          <span>Subtotal</span>
          <strong>₹{{ subtotal }}</strong>
        </div>
        <div class="line">
          <span>Discount</span>
          <strong>₹0</strong>
        </div>
        <div class="line total">
          <span>Total</span>
          <strong>₹{{ total }}</strong>
        </div>
      </div>

      <button type="button" class="payment-button">Proceed to payment</button>
    </aside>
  </div>
</section>
