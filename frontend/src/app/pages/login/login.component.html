<div class="login-page">
  <div class="login-card">
    <div class="brand-header">
      <span class="brand-pill">Kirana</span>
      <h1>StoreOps</h1>
      <p>Manage stock, counters, and khata with a cleaner daily workflow.</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" [attr.aria-busy]="isLoggingIn">
      <div class="role-switch" role="tablist" aria-label="Role selector">
        <button type="button" [disabled]="isLoggingIn" [class.active]="model.role === 'ADMIN'" (click)="model.role = 'ADMIN'">Admin</button>
        <button type="button" [disabled]="isLoggingIn" [class.active]="model.role === 'WORKER'" (click)="model.role = 'WORKER'">Worker</button>
      </div>

      <label>
        <span>Phone number</span>
        <input type="tel" [(ngModel)]="model.phoneNumber" name="phoneNumber" placeholder="9876543210" required [disabled]="isLoggingIn" />
      </label>

      <label>
        <span>Password</span>
        <input type="password" [(ngModel)]="model.password" name="password" placeholder="Enter password" required [disabled]="isLoggingIn" />
      </label>

      <p *ngIf="loginError" class="login-error" role="alert">{{ loginError }}</p>
      <button type="submit" class="primary-button" [disabled]="isLoggingIn" [attr.aria-label]="isLoggingIn ? 'Logging in' : 'Login'">
        <span *ngIf="isLoggingIn" class="login-spinner" aria-hidden="true"></span>
        <span>{{ isLoggingIn ? 'Logging in…' : 'Login' }}</span>
      </button>
      <p *ngIf="isLoggingIn" class="login-status" role="status">Verifying your account…</p>
    </form>
  </div>
</div>
