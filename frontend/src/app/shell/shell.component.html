<div class="app-shell">
  <aside class="sidebar hidden lg:flex">
    <div class="brand-block">
      <img class="brand-logo" src="assets/shop-logo.svg" alt="Naveen Kirana Bazar logo" />
      <div class="brand-copy">
        <p class="eyebrow">Shop</p>
        <h1>NAVEEN KIRANA BAZAR</h1>
      </div>
    </div>

    <nav class="nav-list" aria-label="Sidebar navigation">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg *ngIf="item.label === 'Dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="8" height="8" rx="1.5" /><rect x="13" y="3" width="8" height="5" rx="1.5" />
            <rect x="13" y="10" width="8" height="11" rx="1.5" /><rect x="3" y="13" width="8" height="8" rx="1.5" />
          </svg>
          <svg *ngIf="item.label === 'Inventory'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m3 7 9-4 9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4m-9 4v10" />
          </svg>
          <svg *ngIf="item.label === 'Scan'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V5a1 1 0 0 1 1-1h3m8 0h3a1 1 0 0 1 1 1v3m0 8v3a1 1 0 0 1-1 1h-3m-8 0H5a1 1 0 0 1-1-1v-3M7 9v6m3-6v6m3-6v6m3-6v6" />
          </svg>
          <svg *ngIf="item.label === 'Khata'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 3h14v18l-7-4-7 4V3Zm4 5h6m-6 4h6" />
          </svg>
          <svg *ngIf="item.label === 'Billing'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 3h14v18l-2-1-2 1-3-1-3 1-2-1-2 1V3Zm4 5h6m-6 4h6m-6 4h3" />
          </svg>
          <svg *ngIf="item.label === 'Suppliers'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h11v11H3zM14 11h4l3 3v4h-7zM7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm11 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
          </svg>
          <svg *ngIf="item.label === 'Settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z" />
          </svg>
        </span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <button type="button" class="logout-button" (click)="logout()">Logout</button>
  </aside>

  <header class="mobile-header h-14 px-3">
    <strong>NAVEEN KIRANA</strong>
    <nav class="mobile-header-actions" aria-label="Quick actions">
      <a routerLink="/suppliers" aria-label="Suppliers" title="Suppliers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h11v11H3zM14 11h4l3 3v4h-7zM7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm11 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
        </svg>
      </a>
      <a routerLink="/settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/>
        </svg>
      </a>
      <button type="button" aria-label="Logout" title="Logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 17l5-5-5-5m5 5H3m9-9h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
        </svg>
      </button>
    </nav>
  </header>

  <main class="content-area pb-20 lg:pb-8">
    <router-outlet></router-outlet>
  </main>

  <nav class="mobile-nav lg:hidden fixed bottom-0 inset-x-0 z-50 bg-white border-t border-slate-200 flex justify-around items-center h-16 px-1 shadow-lg" aria-label="Bottom navigation">
    <a routerLink="/dashboard" routerLinkActive="active" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z"/>
      </svg>
      <small>Home</small>
    </a>
    <a routerLink="/billing" routerLinkActive="active" aria-label="POS Bill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 3h14v18l-2-1-2 1-3-1-3 1-2-1-2 1V3Zm4 5h6m-6 4h6m-6 4h3"/>
      </svg>
      <small>POS Bill</small>
    </a>
    <a routerLink="/scan-inspect" routerLinkActive="active" aria-label="Scan" class="scan-tab">
      <span class="scan-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V5a1 1 0 0 1 1-1h3m8 0h3a1 1 0 0 1 1 1v3m0 8v3a1 1 0 0 1-1 1h-3m-8 0H5a1 1 0 0 1-1-1v-3M7 9v6m3-6v6m3-6v6m3-6v6"/>
        </svg>
      </span>
      <small>Scan</small>
    </a>
    <a routerLink="/inventory" routerLinkActive="active" aria-label="Stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16v14H4zM3 7l2-4h14l2 4M8 11h8m-8 4h5"/>
      </svg>
      <small>Stock</small>
    </a>
    <a routerLink="/khata" routerLinkActive="active" aria-label="Khata">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 3h14v18l-7-4-7 4V3Zm4 5h6m-6 4h6"/>
      </svg>
      <small>Khata</small>
    </a>
  </nav>
</div>
